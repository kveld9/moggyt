[package]
name = "moggyt"
version = "0.1.0"
edition = "2024"
description = "Native YouTube Music client (Slint)"
license = "MIT"
repository = "https://github.com/kveld9/moggyt"
rust-version = "1.85"
autoexamples = false

[dependencies]
arboard = { version = "3.7", default-features = false }
anyhow = "1.0.104"
cpal = "0.16"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rodio = "0.21"
rubato = "0.16.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
single-instance = "0.3"
souvlaki = "0.8"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
discord-rich-presence = "1.1"
md-5 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
opus = "0.4.0"
symphonia = { version = "0.5.5", features = ["mkv"] }
slint = "1.18"

[build-dependencies]
slint-build = "1.18"

[package.metadata.deb]
maintainer = "kveld9 <179108235+kveld9@users.noreply.github.com>"
section = "sound"
priority = "optional"
depends = "$auto, libasound2, libayatana-appindicator3-1"
assets = [
    ["target/release/moggyt", "usr/bin/", "755"],
    ["packaging/deb/moggyt.desktop", "usr/share/applications/", "644"],
    ["THIRD_PARTY_NOTICES.md", "usr/share/doc/moggyt/", "644"],
]
extended-description = """\
Native YouTube Music client written in Rust (Slint)."""

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

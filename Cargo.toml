[package]
name = "moggyt"
version = "0.1.0"
edition = "2024"
description = "Native YouTube Music client (Slint)"
license = "MIT"
repository = "https://github.com/kveld9/moggyt"
rust-version = "1.85"
autoexamples = false

[dependencies]
anyhow = "1.0.104"
keyring = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = "0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
single-instance = "0.3"
souvlaki = "0.8"
tray-icon = { version = "0.20", default-features = false }
discord-rich-presence = "0.2"
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slint = "1.13"

[build-dependencies]
slint-build = "1.13"

[package.metadata.deb]
maintainer = "kveld9 <179108235+kveld9@users.noreply.github.com>"
section = "sound"
priority = "optional"
depends = "$auto, libasound2, libayatana-appindicator3-1"
assets = [
    ["target/release/moggyt", "usr/bin/", "755"],
    ["packaging/deb/moggyt.desktop", "usr/share/applications/", "644"],
]
extended-description = """\
Native YouTube Music client written in Rust (Slint)."""

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

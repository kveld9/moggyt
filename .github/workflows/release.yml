# ==============================================================================
# Production Release Pipeline for moggyt
#
# Purpose:
#   Automated multi-platform release workflow for the native YouTube Music client.
#   Builds release binaries on Linux and Windows, packages them into portable
#   distribution archives, generates SHA-256 cryptographic checksums, and publishes
#   a new GitHub Release with release notes.
#
# Triggers:
#   - push to tags 'v*': Automated release trigger when a version tag is pushed (e.g. v1.0.0).
#   - workflow_dispatch: Manual release execution from the Actions tab.
#
# Release Artifacts:
#   - moggyt-<version>-linux.tar.gz: Portable tarball containing the Linux binary (x86_64).
#   - moggyt-<version>-windows.zip: Portable zip containing the Windows binary (x86_64).
#   - moggyt_<version>_amd64.deb: Debian/Ubuntu package with automated dependency resolution.
#   - moggyt-<version>-x86_64.AppImage: Standalone portable AppImage bundle for Linux (x86_64).
#   - SHA256SUMS.txt: Unified SHA-256 checksum manifest compatible with 'sha256sum -c'.
#     (Legacy MD5 and SHA-512 hashes have been dropped to keep release assets clean and lean).
#
# How to cut a release:
#   1. Merge PRs into main (merging to main never publishes a release).
#   2. Tag the desired release commit with a valid SemVer tag and push it:
#        git tag vX.Y.Z && git push origin vX.Y.Z
#   3. The workflow validates the tag format, derives the version, runs matrix builds,
#      packages release archives, computes SHA-256 checksums, and publishes the release
#      to GitHub Releases.
#
# Packaging Roadmap & Installer TODO (SDD Section 10):
#   SDD Section 10 specifies Linux packages (.AppImage, .deb) and Windows
#   installers (NSIS .exe). This workflow ships standalone portable archives (.tar.gz and .zip),
#   native Debian packages (.deb) via cargo-deb, and standalone Linux AppImage bundles (.AppImage)
#   via linuxdeploy and appimagetool.
#   TODO:
#     - Arch Linux packaging: Maintain PKGBUILD in packaging/arch/moggyt-bin (AUR publish deferred; no credentials in v1).
#     - Code signing & Attestations: Integrate Authenticode signing for Windows
#       and GitHub Artifact Attestations via actions/attest-build-provenance.
# ==============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semver:
    name: Compute SemVer
    runs-on: ubuntu-latest
    outputs:
      skip_release: ${{ steps.semver.outputs.skip_release }}
      prev_tag: ${{ steps.semver.outputs.prev_tag }}
      tag_name: ${{ steps.semver.outputs.tag_name }}
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Check out repository with full tag history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Semantic Version from Tag
        id: semver
        shell: bash
        run: |
          git fetch --tags --force

          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '${TAG_NAME}' does not match expected SemVer pattern ^v[0-9]+\.[0-9]+\.[0-9]+$" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v*" --exclude "${TAG_NAME}" 2>/dev/null || echo "")

          echo "Tag: ${TAG_NAME}"
          echo "Version: ${VERSION}"
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag: ${PREV_TAG}"
          else
            echo "No previous tag found (first release)."
          fi

          echo "skip_release=false" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target-os }})
    needs: semver
    if: needs.semver.outputs.skip_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target-os: linux
            binary-path: target/release/moggyt
          - os: windows-latest
            target-os: windows
            binary-path: target/release/moggyt.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Install system dev headers: ALSA for rodio/cpal, Ayatana AppIndicator
      # (plus GTK/glib transitively) for tray-icon/libappindicator build scripts.
      - name: Install Linux system dev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package portable release archive
        shell: bash
        run: |
          VERSION="${{ needs.semver.outputs.version }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd target/release && 7z a "../../dist/moggyt-${VERSION}-windows.zip" moggyt.exe)
          else
            tar -czf "dist/moggyt-${VERSION}-linux.tar.gz" -C target/release moggyt
          fi

      - name: Build Windows NSIS installer (.exe)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          VERSION="${{ needs.semver.outputs.version }}"
          mkdir -p dist
          MAKENSIS="makensis"
          if ! command -v "$MAKENSIS" >/dev/null 2>&1; then
            if [ -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
              MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
            elif [ -f "C:/Program Files (x86)/NSIS/makensis.exe" ]; then
              MAKENSIS="C:/Program Files (x86)/NSIS/makensis.exe"
            else
              echo "Error: makensis not found in PATH or standard installation directory" >&2
              exit 1
            fi
          fi
          "$MAKENSIS" /DVERSION="${VERSION}" packaging/windows/moggyt.nsi

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build Debian package (.deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ needs.semver.outputs.version }}"
          cargo deb --no-build --deb-version "${VERSION}"
          cp target/debian/*.deb dist/

      - name: Build AppImage (.AppImage)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        shell: bash
        run: |
          VERSION="${{ needs.semver.outputs.version }}"
          LINUXDEPLOY_URL="https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20240109-1/linuxdeploy-x86_64.AppImage"
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"

          curl -sSfLo linuxdeploy.AppImage "${LINUXDEPLOY_URL}"
          curl -sSfLo appimagetool.AppImage "${APPIMAGETOOL_URL}"
          chmod +x linuxdeploy.AppImage appimagetool.AppImage

          mkdir -p AppDir
          ALSA_LIB=$(find /usr/lib -name "libasound.so.2" 2>/dev/null | head -n 1)
          INDICATOR_LIB=$(find /usr/lib -name "libayatana-appindicator3.so.1" 2>/dev/null | head -n 1)

          EXTRA_LIBS=()
          [ -n "${ALSA_LIB}" ] && EXTRA_LIBS+=("-l" "${ALSA_LIB}")
          [ -n "${INDICATOR_LIB}" ] && EXTRA_LIBS+=("-l" "${INDICATOR_LIB}")

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            -e target/release/moggyt \
            -d packaging/appimage/moggyt.desktop \
            -i packaging/appimage/moggyt.png \
            "${EXTRA_LIBS[@]}"

          ARCH=x86_64 ./appimagetool.AppImage AppDir "dist/moggyt-${VERSION}-x86_64.AppImage"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.target-os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [semver, build]
    if: needs.semver.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository with tag history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: release-asset-*
          merge-multiple: true

      - name: Generate Cryptographic Checksums
        shell: bash
        working-directory: release_assets
        run: |
          # Single SHA256SUMS.txt manifest compatible with 'sha256sum -c'
          rm -f SHA256SUMS.txt
          for asset in *; do
            if [ -f "$asset" ] && [ "$asset" != "SHA256SUMS.txt" ]; then
              sha256sum "$asset" >> SHA256SUMS.txt
            fi
          done
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Generate Release Notes Body
        shell: bash
        run: |
          TAG="${{ needs.semver.outputs.tag_name }}"
          VERSION="${{ needs.semver.outputs.version }}"
          PREV_TAG="${{ needs.semver.outputs.prev_tag }}"
          REPO="${GITHUB_REPOSITORY}"

          git fetch --tags --force

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          FEATURES=$(git log "$RANGE" --format="- %s (%h)" | grep -E "^- feat(\([^)]+\))?(!)?: " || true)
          FIXES=$(git log "$RANGE" --format="- %s (%h)" | grep -E "^- fix(\([^)]+\))?(!)?: " || true)
          PERFS=$(git log "$RANGE" --format="- %s (%h)" | grep -E "^- perf(\([^)]+\))?(!)?: " || true)
          REFACTORS=$(git log "$RANGE" --format="- %s (%h)" | grep -E "^- refactor(\([^)]+\))?(!)?: " || true)
          REVERTS=$(git log "$RANGE" --format="- %s (%h)" | grep -E "^- revert(\([^)]+\))?(!)?: " || true)
          BREAKING=$(git log "$RANGE" --format="- %s (%h)" | grep -E "^- [a-z]+(\([^)]+\))?!: " || true)
          BREAKING_BODY=$(git log "$RANGE" --format="%H %s" --grep="BREAKING CHANGE" | sed -E "s/^([0-9a-f]+) (.*)$/- \2 (\1)/" || true)
          DEPS=$(git diff --name-only "$RANGE" | grep -E '^(Cargo\.toml|Cargo\.lock)$' || true)

          cat << 'EOF' > release_body.md
          ## Release Details
          EOF

          echo "- Version: \`${VERSION}\`" >> release_body.md
          echo "- Tag: \`${TAG}\`" >> release_body.md
          echo "" >> release_body.md

          echo "### What's Changed" >> release_body.md
          if [ -n "$BREAKING" ] || [ -n "$BREAKING_BODY" ]; then
            echo "#### Breaking Changes" >> release_body.md
            [ -n "$BREAKING" ] && echo "$BREAKING" >> release_body.md
            [ -n "$BREAKING_BODY" ] && echo "$BREAKING_BODY" >> release_body.md
            echo "" >> release_body.md
          fi
          if [ -n "$FEATURES" ]; then
            echo "#### Features" >> release_body.md
            echo "$FEATURES" >> release_body.md
            echo "" >> release_body.md
          fi
          if [ -n "$FIXES" ]; then
            echo "#### Fixes" >> release_body.md
            echo "$FIXES" >> release_body.md
            echo "" >> release_body.md
          fi
          if [ -n "$PERFS" ]; then
            echo "#### Performance" >> release_body.md
            echo "$PERFS" >> release_body.md
            echo "" >> release_body.md
          fi
          if [ -n "$REFACTORS" ]; then
            echo "#### Refactors" >> release_body.md
            echo "$REFACTORS" >> release_body.md
            echo "" >> release_body.md
          fi
          if [ -n "$REVERTS" ]; then
            echo "#### Reverts" >> release_body.md
            echo "$REVERTS" >> release_body.md
            echo "" >> release_body.md
          fi
          if [ -n "$DEPS" ]; then
            echo "#### Dependencies" >> release_body.md
            for dep in $DEPS; do
              echo "- $dep" >> release_body.md
            done
            echo "" >> release_body.md
          fi
          if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$PERFS" ] && [ -z "$REFACTORS" ] && [ -z "$REVERTS" ] && [ -z "$BREAKING" ] && [ -z "$BREAKING_BODY" ] && [ -z "$DEPS" ]; then
            echo "_No application changes in this range._" >> release_body.md
            echo "" >> release_body.md
          fi

          if [ -n "$PREV_TAG" ] && [ -n "$REPO" ]; then
            echo "**Full Changelog:** https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}" >> release_body.md
            echo "" >> release_body.md
          fi

          echo "### Download & Verification" >> release_body.md
          echo "| File | SHA-256 Checksum |" >> release_body.md
          echo "| :--- | :--- |" >> release_body.md

          cd release_assets
          while read -r hash filename; do
            echo "| \`${filename}\` | \`${hash}\` |" >> ../release_body.md
          done < SHA256SUMS.txt
          cd ..

          echo "" >> release_body.md
          echo "To verify downloads:" >> release_body.md
          echo '```bash' >> release_body.md
          echo 'sha256sum -c SHA256SUMS.txt' >> release_body.md
          echo '```' >> release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.semver.outputs.tag_name }}
          name: ${{ needs.semver.outputs.tag_name }}
          body_path: release_body.md
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false

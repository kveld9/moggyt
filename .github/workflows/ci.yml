name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Principle of least privilege: explicitly restrict default token permissions to read-only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Repository Standards & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify executable permissions on scripts
        run: |
          test -x scripts/check-repo.sh || { echo "::error::scripts/check-repo.sh is not executable (fix: git update-index --chmod=+x scripts/check-repo.sh)" >&2; exit 1; }

      - name: Verify no emojis in execution surfaces
        run: |
          echo "Scanning execution surfaces for prohibited emojis..."
          TARGETS=(
            scripts/
            src/
            .github/workflows/
            .github/dependabot.yml
            .github/settings.example.yml
            .github/CODEOWNERS
            .github/CODEOWNERS.example
            .editorconfig
            .gitattributes
            .gitignore
            Cargo.toml
            rustfmt.toml
            clippy.toml
          )
          if grep -rnP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}]' "${TARGETS[@]}"; then
            echo "::error::Prohibited emojis detected in execution surfaces (scripts, configs, workflows, code)." >&2
            echo "Emojis are strictly forbidden in code, scripts, configs, and CI workflows." >&2
            echo "Permitted only in human-facing documentation (README.md, docs/**) and release notes." >&2
            exit 1
          fi
          echo "All execution surfaces are clean of emojis."

      - name: Run Repository Standards Audit
        run: ./scripts/check-repo.sh

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  lint-markdown:
    name: Markdown Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules
            !target
